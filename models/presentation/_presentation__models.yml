version: 2

models:
  - name: prs_governismo
    description: >
      Grão: um voto por parlamentar por votação onde o Governo emitiu orientação.
      Cobre Câmara (desde 1991) e Senado. Permite calcular perc_governismo para
      qualquer período (ano, trimestre, legislatura) e rastrear a evolução temporal
      do alinhamento de cada parlamentar ao governo.
    columns:
      - name: sk_voto
        description: Chave substituta do evento de voto (parlamentar × votação).
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: Chave substituta estável do parlamentar.
        tests:
          - not_null
      - name: casa
        description: Casa legislativa (camara/senado).
      - name: nome_eleitoral
        description: Nome eleitoral como exibido ao público.
      - name: partido
        description: Sigla do partido no mandato mais recente.
      - name: uf_representacao
        description: UF representada no mandato mais recente.
      - name: data_voto
        description: Data em que a votação ocorreu.
      - name: ano
        description: Ano da votação, extraído de data_voto.
      - name: trimestre
        description: Primeiro dia do trimestre da votação (truncado).
      - name: descricao_votacao
        description: Texto identificando a proposição votada (ex. "PEC 6/2019 — Reforma da Previdência").
      - name: sigla_orgao
        description: Sigla do órgão/comissão ou tipo de proposição (ex. PLEN, PEC, PLP).
      - name: votacao_aprovada
        description: TRUE se a votação resultou em aprovação, FALSE se reprovada, NULL se não informado.
      - name: voto_parlamentar
        description: Voto registrado pelo parlamentar (SIM, NAO, ABSTENCAO, OBSTRUCAO).
      - name: voto_governo
        description: Orientação emitida pelo Governo para esta votação (SIM, NAO).
      - name: alinhado_ao_governo
        description: TRUE se o voto coincidiu com a orientação do Governo, FALSE se divergiu, NULL se abstenção.
      - name: presidente
        description: Nome do presidente da República no momento da votação, derivado do seed raw_executivo_presidente.
      - name: mandato
        description: Número ordinal do mandato do presidente (ex. 1 = primeiro mandato, 2 = segundo, 3 = terceiro).
  - name: prs_ecidadania_proposicoes
    description: Apresentação de proposições da plataforma e-Cidadania enriquecida com atributos de tramitação e deliberação do Senado. Desabilitada enquanto e-Cidadania não estiver ativo.
    columns:
      - name: data_extracao
        description: Data de extração dos dados da fonte.
      - name: sk_proposicao
        description: Chave substituta da proposição.
        tests:
          - not_null
      - name: id_proposicao
        description: Identificador da proposição na fonte.
      - name: ano_proposicao
        description: Ano de apresentação da proposição.
      - name: apelido
        description: Apelido ou nome popular da proposição.
      - name: ementa
        description: Ementa descritiva da proposição.
      - name: tramitando
        description: Indica se a proposição está em tramitação ativa.
      - name: votos_sim
        description: Quantidade de votos favoráveis à proposição.
      - name: votos_nao
        description: Quantidade de votos contrários à proposição.
      - name: total_votos
        description: Total de votos registrados para a proposição.
      - name: vontade_popular
        description: Indicador da vontade popular (SIM/NÃO) com base na maioria dos votos.
      - name: tipo_deliberacao
        description: Categoria do tipo de deliberação da proposição.
      - name: aderencia_vontade_popular
        description: Indicador de aderência entre a deliberação parlamentar e a vontade popular.
      - name: flag_mais_votado_no_dia
        description: Booleano indicando se a proposição estava entre as mais votadas na data de extração.
      - name: casa
        description: Casa legislativa de origem da proposição (SF, CD).
      - name: status_consultado
        description: Status da consulta pública associada à proposição.
      - name: nome_ente
        description: Nome do ente vinculado à proposição.
      - name: descricao_proposicao
        description: Descrição completa do tipo de proposição.
      - name: data_apresentacao
        description: Data de apresentação da proposição.
      - name: autoria
        description: Autoria da proposição (parlamentar, comissão, poder executivo).
      - name: descricao_deliberacao
        description: Descrição textual do tipo de deliberação.
      - name: data_deliberacao
        description: Data da deliberação/votação mais recente.
      - name: norma_gerada
        description: Norma jurídica gerada pela proposição, se aprovada.
      - name: link_documento
        description: URL para o documento oficial da proposição.
      - name: link_votacao
        description: URL para a votação da proposição na plataforma e-Cidadania.
