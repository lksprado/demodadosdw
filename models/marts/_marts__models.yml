version: 2

models:

  - name: dim_parlamentares
    description: Dimensão conformada unificada de parlamentares (senadores e deputados). União direta de int_deputados_padronizados e int_senadores_padronizados com sk_parlamentar gerado.
    columns:
      - name: sk_parlamentar
        description: Chave substituta estável do parlamentar.
        tests:
          - not_null
          - unique
      - name: casa
        description: Casa legislativa (CAMARA ou SENADO).
      - name: id
        description: Identificador natural do parlamentar na casa de origem.
      - name: nome
        description: Nome eleitoral / parlamentar.
      - name: nome_completo
        description: Nome civil completo.
      - name: sexo
        description: Sexo informado no cadastro (MASCULINO/FEMININO).
      - name: uf
        description: UF de nascimento (deputados) ou representação (senadores).

  - name: dim_votacoes
    description: Dimensão de sessões de votação unificada (Câmara e Senado). Alimenta joins em prs_governismo e análises de resultado.
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (codigo/id + casa).
        tests:
          - not_null
          - unique
      - name: casa
        description: Casa legislativa da votação (CAMARA ou SENADO).
      - name: data_votacao
        description: Data da sessão de votação.
      - name: objeto
        description: Descrição da proposição ou matéria votada.
      - name: aprovado
        description: 1 se aprovada, 0 caso contrário.

  - name: dim_orientacao_votacoes
    description: Dimensão de orientações de voto por partido/bancada (Câmara e Senado). Alimenta análises de alinhamento governista.
    columns:
      - name: sk_votacao
        description: Chave substituta da votação, join com dim_votacoes.
        tests:
          - not_null
      - name: tipo_lideranca
        description: "Tipo de liderança que emitiu a orientação (BANCADA ou PARTIDO). Nulo para o Senado."
      - name: sigla_partido_bloco
        description: Sigla do partido ou bloco que recebeu a orientação.
      - name: orientacao_voto
        description: Orientação de voto (SIM, NAO, OBSTRUCAO).

  - name: dim_parlamentares_score
    description: "Dimensão de scores do Ranking dos Políticos por parlamentar (Câmara e Senado). Grain: um registro por parlamentar."
    columns:
      - name: sk_parlamentar
        description: Chave substituta do parlamentar, join com dim_parlamentares.
        tests:
          - not_null
          - unique
      - name: pontuacao_geral
        description: Pontuação total atual no Ranking dos Políticos.
      - name: ranking_geral
        description: Posição no ranking geral entre todos os parlamentares.
      - name: ranking_casa
        description: Posição no ranking dentro da casa legislativa.
      - name: ranking_partido
        description: Posição no ranking dentro do partido.
      - name: ranking_estado
        description: Posição no ranking dentro do estado.
      - name: ranking_casa_estado
        description: Posição no ranking da casa dentro do estado.

  - name: dim_parlamentares_score_historico
    description: "Dimensão de scores históricos por ano do Ranking dos Políticos (Câmara e Senado). Grain: um registro por parlamentar por ano."
    columns:
      - name: sk_parlamentar
        description: Chave substituta do parlamentar, join com dim_parlamentares.
        tests:
          - not_null
      - name: ano
        description: Ano de referência do score.
      - name: pontuacao
        description: Pontuação final do parlamentar naquele ano.
      - name: nota_base_votacoes
        description: Nota base referente a votações naquele ano.
      - name: nota_base_gastos
        description: Nota base referente a controle de gastos naquele ano.
      - name: nota_base_presenca
        description: Nota base referente a presença/assiduidade naquele ano.
      - name: nota_base_privilegios
        description: Nota base referente à rejeição de privilégios naquele ano.
      - name: bonus_processos
        description: Bônus/penalidade por processos judiciais.
      - name: bonus_producao_legislativa
        description: Bônus por produção legislativa.
      - name: bonus_articulacao_legislativa
        description: Bônus por articulação legislativa.

  - name: fct_votos
    description: "Fato de votos individuais unificado (Câmara e Senado). Grain: um voto por parlamentar por votação."
    columns:
      - name: sk_voto
        description: Chave substituta do evento de voto (parlamentar × votação × casa).
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: Chave substituta do parlamentar, join com dim_parlamentares.
        tests:
          - not_null
      - name: sk_votacao
        description: Chave substituta da votação, join com dim_votacoes.
        tests:
          - not_null
      - name: casa
        description: Casa legislativa do voto (CAMARA ou SENADO).
      - name: voto
        description: "Voto registrado (SIM, NAO, ABSTENCAO, OBSTRUCAO)."

  - name: fct_ecidadania_bignumbers
    description: Fato com os totais agregados de votações e votantes na plataforma e-Cidadania.
    columns:
      - name: data_extracao
        description: Data de extração dos dados da fonte.
      - name: total_proposicoes_votadas
        description: Quantidade total de proposições que receberam votos.
      - name: total_pessoas_votaram
        description: Quantidade total de pessoas distintas que votaram.
      - name: total_votos_registrados
        description: Quantidade total de votos registrados na plataforma.
      - name: votos_por_pessoa
        description: Média de votos por pessoa (total_votos / total_pessoas).

  - name: fct_ecidadania_proposicoes
    description: Fato com métricas de votação por proposição na plataforma e-Cidadania, com flag indicando se foi a mais votada no dia da extração.
    columns:
      - name: data_extracao
        description: Data de extração dos dados da fonte.
      - name: ano_proposicao
        description: Ano de apresentação da proposição.
      - name: sigla_proposicao
        description: Sigla do tipo de proposição (ex PL, PEC).
      - name: sk_proposicao
        description: Chave substituta da proposição.
        tests:
          - not_null
      - name: id_proposicao
        description: Identificador da proposição na fonte.
      - name: ementa
        description: Ementa descritiva da proposição.
      - name: votos_sim
        description: Quantidade de votos favoráveis à proposição.
      - name: votos_nao
        description: Quantidade de votos contrários à proposição.
      - name: total_votos
        description: Total de votos registrados para a proposição.
      - name: vontade_popular
        description: Indicador da vontade popular (SIM/NÃO) com base na maioria dos votos.
      - name: link
        description: URL da proposição na plataforma e-Cidadania.
      - name: flag_mais_votado_no_dia
        description: Booleano indicando se a proposição estava entre as mais votadas na data de extração.
