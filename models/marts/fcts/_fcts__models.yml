version: 2

models:

  - name: fct_votos
    description: "Fato de votos individuais unificado (Câmara e Senado). Grain: um voto por parlamentar por votação."
    columns:
      - name: sk_voto
        description: Chave substituta do evento de voto (parlamentar × votação × casa).
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: Chave substituta do parlamentar, join com dim_parlamentares.
        tests:
          - not_null
      - name: sk_votacao
        description: Chave substituta da votação, join com dim_votacoes.
        tests:
          - not_null
      - name: casa
        description: Casa legislativa do voto (CAMARA ou SENADO).
      - name: voto
        description: "Voto registrado (SIM, NAO, ABSTENCAO, OBSTRUCAO)."

  - name: fct_ecidadania_bignumbers
    description: Fato com os totais agregados de votações e votantes na plataforma e-Cidadania.
    columns:
      - name: data_extracao
        description: Data de extração dos dados da fonte.
      - name: total_proposicoes_votadas
        description: Quantidade total de proposições que receberam votos.
      - name: total_pessoas_votaram
        description: Quantidade total de pessoas distintas que votaram.
      - name: total_votos_registrados
        description: Quantidade total de votos registrados na plataforma.
      - name: votos_por_pessoa
        description: Média de votos por pessoa (total_votos / total_pessoas).

  - name: fct_ecidadania_proposicoes
    description: Fato com métricas de votação por proposição na plataforma e-Cidadania, com flag indicando se foi a mais votada no dia da extração.
    columns:
      - name: data_extracao
        description: Data de extração dos dados da fonte.
      - name: ano_proposicao
        description: Ano de apresentação da proposição.
      - name: sigla_proposicao
        description: Sigla do tipo de proposição (ex PL, PEC).
      - name: sk_proposicao
        description: Chave substituta da proposição.
        tests:
          - not_null
      - name: id_proposicao
        description: Identificador da proposição na fonte.
      - name: ementa
        description: Ementa descritiva da proposição.
      - name: votos_sim
        description: Quantidade de votos favoráveis à proposição.
      - name: votos_nao
        description: Quantidade de votos contrários à proposição.
      - name: total_votos
        description: Total de votos registrados para a proposição.
      - name: vontade_popular
        description: Indicador da vontade popular (SIM/NÃO) com base na maioria dos votos.
      - name: link
        description: URL da proposição na plataforma e-Cidadania.
      - name: flag_mais_votado_no_dia
        description: Booleano indicando se a proposição estava entre as mais votadas na data de extração.
