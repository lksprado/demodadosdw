
version: 2

sources:
  - name: senado
    database: demodados
    schema: raw
    loaded_at_field: data_carga
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    tables:
      - name: raw_senado_senadores
        description: "Detalhes dos senadores obtidos da API do Senado Federal"
        columns:
          - name: id
            tests:
              - unique
              - not_null
      - name: raw_senado_status
        description: "Status e tramitação das proposições legislativas do Senado"
      - name: raw_senado_tipos_decisao
        description: "Tipos de deliberações de proposições legislativas"
      - name: raw_senado_tipos_entes
        description: "Tipos de entes vinculados às proposições"
      - name: raw_senado_tipos_projetos
        description: "Siglas e descrições dos tipos de proposições legislativas"
