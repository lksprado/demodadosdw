version: 2

models:
  - name: stg_camara_deputados
    description: "Seleção mínima de colunas da API da Câmara para deputados. Renaming e enriquecimento ocorrem em int_deputados."
    columns:
      - name: id
        description: "Identificador único do deputado na API da Câmara."
      - name: nomecivil
        description: "Nome civil bruto conforme retornado pela API."
      - name: ultimostatus_nomeeleitoral
        description: "Nome eleitoral bruto do último status do deputado."
      - name: sexo
        description: "Sexo informado no cadastro (M/F)."
      - name: redesocial
        description: "Campo único da API com links de redes sociais (texto ou JSON)."
      - name: datanascimento
        description: "Data de nascimento bruta conforme API."
      - name: datafalecimento
        description: "Data de falecimento, quando houver."
      - name: ufnascimento
        description: "UF de nascimento bruta conforme API."
      - name: municipionascimento
        description: "Município de nascimento bruto conforme API."
      - name: escolaridade
        description: "Grau de escolaridade informado."
      - name: email
        description: "E-mail institucional — COALESCE de ultimostatus_email e ultimostatus_gabinete_email."

  - name: stg_camara_legislaturas
    description: "Modelo staging com o mapeamento de deputados por legislatura"
    columns:
      - name: id
        description: "Identificador da legislatura"
      - name: id_deputado
        description: "Identificador do deputado na API da Câmara"

  - name: stg_camara_votacoes
    description: "Modelo staging com as sessões de votação da Câmara"
    columns:
      - name: id
        description: "Identificador único da votação"
      - name: data_votacao
        description: "Data da votação"
      - name: datahora_votacao
        description: "Data e hora do registro da votação"
      - name: sigla_orgao
        description: "Sigla do órgão que realizou a votação (ex: PLEN, CSPCCO)"
      - name: proposicao_objeto
        description: "Descrição da proposição objeto da votação"
      - name: descricao
        description: "Descrição da votação"
      - name: aprovado
        description: "Booleano indicando se a proposição foi aprovada"

  - name: stg_camara_votacoes_orientacao
    description: "Modelo staging com a orientação de cada partido/liderança por votação"
    columns:
      - name: orientacao_voto
        description: "Orientação de voto dada pelo líder (SIM, NÃO, LIBERADO, OBSTRUÇÃO)"
      - name: codigo_tipo_liderancao
        description: "Código do tipo de liderança que deu a orientação"
      - name: codigo_partido_bloco
        description: "Código do partido ou bloco que recebeu a orientação"
      - name: sigla_partido_bloco
        description: "Sigla do partido ou bloco que recebeu a orientação"
      - name: id_votacao
        description: "Identificador da votação à qual a orientação se refere"

  - name: stg_camara_votos_deputados
    description: "Modelo staging com o voto individual de cada deputado por votação"
    columns:
      - name: id_deputado
        description: "Identificador do deputado na API da Câmara"
      - name: id_votacao
        description: "Identificador da votação à qual a orientação se refere"
      - name: voto
        description: "Tipo do voto registrado (SIM, NÃO, ABSTENCAO, OBSTRUÇÃO, ARTIGO17)"
      - name: id_legislatura
        description: "Identificador da legislatura na qual o voto foi registrado"
