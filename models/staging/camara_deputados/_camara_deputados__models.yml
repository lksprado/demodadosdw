version: 2

models:
  - name: stg_camara_deputados
    description: "Modelo staging que carrega e padroniza os dados brutos da API da Câmara para deputados"
    columns:
      - name: id
        description: "Identificador único do deputado na API da Câmara"
        tests:
          - not_null
          - unique
      - name: nome
        description: "Nome civil completo do deputado"
      - name: nome_eleitoral
        description: "Nome eleitoral como exibido ao público"
      - name: partido
        description: "Sigla do partido no momento mais recente da carga"
      - name: email
        description: "E-mail institucional do gabinete"
      - name: redesocial_x_twitter
        description: "URL do perfil no X/Twitter"
      - name: redesocial_instagram
        description: "URL do perfil no Instagram"
      - name: redesocial_facebook
        description: "URL da página/perfil no Facebook"
      - name: redesocial_youtube
        description: "URL do canal no YouTube"
      - name: telefone
        description: "Telefone do gabinete"
      - name: sexo
        description: "Sexo informado no cadastro (M/F)"
      - name: data_nascimento
        description: "Data de nascimento do parlamentar"
      - name: geracao
        description: "Faixa geracional derivada da data de nascimento (GRANDIOSA, SILENCIOSA, BABY BOOMER, X, MILLENIAL, Z, ALPHA)"
      - name: uf_nascimento
        description: "Unidade federativa de nascimento"
      - name: municipio_nascimento
        description: "Município de nascimento"
      - name: uf_representacao
        description: "Unidade federativa representada no mandato"
      - name: escolaridade
        description: "Grau de escolaridade informado"
      - name: id_legislatura
        description: "Identificador da última legislatura"
      - name: data_posse
        description: "Data de posse no mandato atual"
      - name: num_gabinete_predio
        description: "Identificação do prédio do gabinete"
      - name: num_gabinete_andar
        description: "Andar do gabinete"
      - name: num_gabinete_sala
        description: "Número da sala do gabinete"
      - name: situacao_atual
        description: "Situação atual do mandato (ex: EXERCÍCIO, AFASTADO)"
      - name: condicao_eleitoral
        description: "Condição eleitoral mais recente (TITULAR, SUPLENTE)"
      - name: link_foto
        description: "URL da foto oficial do deputado"
      - name: link_api_oficial
        description: "URL para o detalhe oficial do deputado na API da Câmara"
      - name: data_carga
        description: "Data/hora de ingestão do registro na camada raw"

  - name: stg_camara_legislaturas
    description: "Modelo staging com o mapeamento de deputados por legislatura"
    columns:
      - name: id
        description: "Identificador da legislatura"
      - name: id_deputado
        description: "Identificador do deputado na API da Câmara"

  - name: stg_camara_votacoes
    description: "Modelo staging com as sessões de votação da Câmara"
    columns:
      - name: id
        description: "Identificador único da votação"
        tests:
          - not_null
          - unique
      - name: data_votacao
        description: "Data da votação"
      - name: datahora_votacao
        description: "Data e hora do registro da votação"
      - name: sigla_orgao
        description: "Sigla do órgão que realizou a votação (ex: PLEN, CSPCCO)"
      - name: proposicao_objeto
        description: "Descrição da proposição objeto da votação"
      - name: descricao
        description: "Descrição da votação"
      - name: aprovado
        description: "Booleano indicando se a proposição foi aprovada"

  - name: stg_camara_votacoes_orientacao
    description: "Modelo staging com a orientação de cada partido/liderança por votação"
    columns:
      - name: orientacao_voto
        description: "Orientação de voto dada pelo líder (SIM, NÃO, LIBERADO, OBSTRUÇÃO)"
      - name: codigo_tipo_liderancao
        description: "Código do tipo de liderança que deu a orientação"
      - name: codigo_partido_bloco
        description: "Código do partido ou bloco que recebeu a orientação"
      - name: sigla_partido_bloco
        description: "Sigla do partido ou bloco que recebeu a orientação"
      - name: id_votacao
        description: "Identificador da votação à qual a orientação se refere"

  - name: stg_camara_votos_deputados
    description: "Modelo staging com o voto individual de cada deputado por votação"
    columns:
      - name: id_deputado
        description: "Identificador do deputado na API da Câmara"
        tests:
          - not_null
      - name: id_votacao
        description: "Identificador da votação à qual a orientação se refere"
      - name: voto
        description: "Tipo do voto registrado (SIM, NÃO, ABSTENCAO, OBSTRUÇÃO, ARTIGO17)"
      - name: id_legislatura
        description: "Identificador da legislatura na qual o voto foi registrado"
