
version: 2

sources:
  - name: camara
    database: demodados
    schema: raw
    loaded_at_field: data_carga
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 48, period: hour}
    tables:
      - name: raw_camara_deputados
        description: "Detalhes dos deputados obtidos da API da Câmara dos Deputados. Endpoint: https://dadosabertos.camara.leg.br/api/v2/deputados/{id}"
        columns:
          - name: id
            tests:
              - unique
              - not_null
      - name: raw_camara_legislaturas
        description: "Mapeamento de deputados por legislatura. Endpoint: https://dadosabertos.camara.leg.br/api/v2/deputados/?idLegislatura={id_legislatura}&ordem=ASC&ordenarPor=nome"
      - name: raw_camara_votacoes
        description: "Sessões de votação da Câmara. Endpoint: https://dadosabertos.camara.leg.br/api/v2/votacoes/?dataInicio={data}&dataFim={data}&itens=100&ordem=DESC&ordenarPor=dataHoraRegistro"
        columns:
          - name: id
            tests:
              - not_null
              - unique:
                  config:
                    severity: warn
      - name: raw_camara_votos_deputados
        description: "Votos individuais por deputado por votação. Endpoint: https://dadosabertos.camara.leg.br/api/v2/votacoes/{id_votacao/votos"
      - name: raw_camara_votacoes_orientacao
        description: "Orientação de voto por partido/liderança por votação. Endpoint: https://dadosabertos.camara.leg.br/api/v2/votacoes/{id_votacao}/orientacoes"
