
version: 2

sources:
  - name: ecidadania
    database: demodados
    schema: raw
    loaded_at_field: data_carga
    freshness:
      warn_after: {count: 160, period: hour}
    tables:
      - name: raw_ecidadania_mais_votados
        description: "Proposições legislativas em destaque (mais votadas no dia) na plataforma e-Cidadania"

      - name: raw_ecidadania_paginas
        description: "Todas as proposições legislativas (em andamento e encerradas) na plataforma e-Cidadania"

      - name: raw_ecidadania_bignumbers
        description: "Totais agregados de votações e votantes na plataforma e-Cidadania"