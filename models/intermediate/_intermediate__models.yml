version: 2

models:

  # ── PARLAMENTARES ──────────────────────────────────────────────────────────

  - name: int_deputados_padronizados
    description: "Deputados normalizados com renaming de colunas e código de sexo expandido. Alimenta dim_parlamentares."
    columns:
      - name: casa
        description: "Casa legislativa (constante 'CAMARA')."
      - name: id
        description: "Identificador do deputado na API da Câmara."
        tests:
          - not_null
          - unique
      - name: nome
        description: "Nome eleitoral do deputado."
      - name: nome_completo
        description: "Nome civil completo."
      - name: sexo
        description: "Sexo expandido (MASCULINO/FEMININO)."
      - name: uf
        description: "UF de nascimento."

  - name: int_senadores_padronizados
    description: "Senadores normalizados combinando endpoint de senadores atuais (prioridade) com histórico de legislaturas. Alimenta dim_parlamentares."
    columns:
      - name: casa
        description: "Casa legislativa (constante 'SENADO')."
      - name: id
        description: "Código do senador na API do Senado."
        tests:
          - not_null
          - unique
      - name: nome
        description: "Nome parlamentar do senador."
      - name: nome_completo
        description: "Nome completo do senador."
      - name: sexo
        description: "Sexo conforme cadastro do Senado."
      - name: uf
        description: "UF de representação do senador."

  # ── SCORES ─────────────────────────────────────────────────────────────────

  - name: int_deputados_pontuacao
    description: "Scores agregados do Ranking dos Políticos para deputados, com ranking renomeado e sk_parlamentar gerado. Alimenta dim_parlamentares_score."
    columns:
      - name: sk_parlamentar
        description: "Chave substituta gerada de (casa, id_congresso)."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (constante 'CAMARA')."
      - name: id
        description: "ID no Ranking dos Políticos."
      - name: id_congresso
        description: "FK do deputado na API da Câmara."
      - name: nome
        description: "Nome completo padronizado."
      - name: nome_civil
        description: "Nome civil padronizado."
      - name: partido
        description: "Sigla do partido."
      - name: situacao
        description: "Situação do mandato."
      - name: slug
        description: "Slug no Ranking dos Políticos."
      - name: pontuacao_geral
        description: "Pontuação total atual no Ranking dos Políticos."
      - name: ranking_geral
        description: "Posição no ranking geral."
      - name: ranking_casa
        description: "Posição no ranking da Câmara."
      - name: ranking_partido
        description: "Posição no ranking do partido."
      - name: ranking_estado
        description: "Posição no ranking do estado."
      - name: ranking_casa_estado
        description: "Posição no ranking da Câmara por estado."
      - name: uf
        description: "UF de representação (normalizada para sigla)."

  - name: int_senadores_pontuacao
    description: "Scores agregados do Ranking dos Políticos para senadores, com ranking renomeado e sk_parlamentar gerado. Alimenta dim_parlamentares_score."
    columns:
      - name: sk_parlamentar
        description: "Chave substituta gerada de (casa, id_congresso)."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (constante 'SENADO')."
      - name: id
        description: "ID no Ranking dos Políticos."
      - name: id_congresso
        description: "FK do senador na API do Senado."
      - name: nome
        description: "Nome completo padronizado."
      - name: nome_civil
        description: "Nome civil padronizado."
      - name: partido
        description: "Sigla do partido."
      - name: situacao
        description: "Situação do mandato."
      - name: slug
        description: "Slug no Ranking dos Políticos."
      - name: pontuacao_geral
        description: "Pontuação total atual no Ranking dos Políticos."
      - name: ranking_geral
        description: "Posição no ranking geral."
      - name: ranking_casa
        description: "Posição no ranking do Senado."
      - name: ranking_partido
        description: "Posição no ranking do partido."
      - name: ranking_estado
        description: "Posição no ranking do estado."
      - name: ranking_casa_estado
        description: "Posição no ranking do Senado por estado."
      - name: uf
        description: "UF de representação (normalizada para sigla)."

  - name: int_deputados_pontuacao_explodida
    description: "Scores de deputados explodidos por ano via JSON (composicao_pontuacao_anos). Uma linha por deputado por ano. Alimenta dim_parlamentares_score_historico."
    columns:
      - name: sk_parlamentar
        description: "Chave substituta gerada de (casa, id_congresso)."
        tests:
          - not_null
      - name: casa
        description: "Casa legislativa (constante 'CAMARA')."
      - name: id
        description: "ID no Ranking dos Políticos."
      - name: id_congresso
        description: "FK do deputado na API da Câmara."
      - name: nome
        description: "Nome completo padronizado."
      - name: nome_civil
        description: "Nome civil padronizado."
      - name: partido
        description: "Sigla do partido."
      - name: situacao
        description: "Situação do mandato."
      - name: uf
        description: "UF de representação (normalizada para sigla)."
      - name: slug
        description: "Slug no Ranking dos Políticos."
      - name: pontuacao_geral
        description: "Pontuação total atual."
      - name: ranking_geral
        description: "Posição no ranking geral."
      - name: ranking_casa
        description: "Posição no ranking da Câmara."
      - name: ranking_partido
        description: "Posição no ranking do partido."
      - name: ranking_estado
        description: "Posição no ranking do estado."
      - name: ranking_casa_estado
        description: "Posição no ranking da Câmara por estado."
      - name: ano
        description: "Ano de referência do score explodido."
      - name: nota_base_votacoes
        description: "Nota base referente a votações naquele ano."
      - name: nota_base_gastos
        description: "Nota base referente a controle de gastos naquele ano."
      - name: nota_base_presenca
        description: "Nota base referente a presença/assiduidade naquele ano."
      - name: nota_base_privilegios
        description: "Nota base referente à rejeição de privilégios naquele ano."
      - name: bonus_processos
        description: "Bônus/penalidade por processos judiciais."
      - name: bonus_producao_legislativa
        description: "Bônus por produção legislativa."
      - name: bonus_articulacao_legislativa
        description: "Bônus por articulação legislativa."
      - name: pontuacao
        description: "Pontuação final do deputado naquele ano."

  - name: int_senadores_pontuacao_explodida
    description: "Scores de senadores explodidos por ano via JSON. Uma linha por senador por ano. Alimenta dim_parlamentares_score_historico."
    columns:
      - name: sk_parlamentar
        description: "Chave substituta gerada de (casa, id_congresso)."
        tests:
          - not_null
      - name: casa
        description: "Casa legislativa (constante 'SENADO')."
      - name: id
        description: "ID no Ranking dos Políticos."
      - name: id_congresso
        description: "FK do senador na API do Senado."
      - name: nome
        description: "Nome completo padronizado."
      - name: nome_civil
        description: "Nome civil padronizado."
      - name: partido
        description: "Sigla do partido."
      - name: situacao
        description: "Situação do mandato."
      - name: uf
        description: "UF de representação (normalizada para sigla)."
      - name: slug
        description: "Slug no Ranking dos Políticos."
      - name: pontuacao_geral
        description: "Pontuação total atual."
      - name: ranking_geral
        description: "Posição no ranking geral."
      - name: ranking_casa
        description: "Posição no ranking do Senado."
      - name: ranking_partido
        description: "Posição no ranking do partido."
      - name: ranking_estado
        description: "Posição no ranking do estado."
      - name: ranking_casa_estado
        description: "Posição no ranking do Senado por estado."
      - name: ano
        description: "Ano de referência do score explodido."
      - name: nota_base_votacoes
        description: "Nota base referente a votações naquele ano."
      - name: nota_base_gastos
        description: "Nota base referente a controle de gastos naquele ano."
      - name: nota_base_presenca
        description: "Nota base referente a presença/assiduidade naquele ano."
      - name: nota_base_privilegios
        description: "Nota base referente à rejeição de privilégios naquele ano."
      - name: bonus_processos
        description: "Bônus/penalidade por processos judiciais."
      - name: bonus_producao_legislativa
        description: "Bônus por produção legislativa."
      - name: bonus_articulacao_legislativa
        description: "Bônus por articulação legislativa."
      - name: pontuacao
        description: "Pontuação final do senador naquele ano."

  # ── VOTAÇÕES ───────────────────────────────────────────────────────────────

  - name: int_votos_camara_filtrados
    description: "Votos individuais de deputados normalizados (BRANCO → NULL, FAVORAVEL COM RESTRICOES → SIM) com chaves substitutas geradas. Alimenta fct_votos."
    columns:
      - name: sk_voto
        description: Chave substituta do voto (id_deputado + id_votacao + casa).
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: Chave substituta do parlamentar (id_deputado + casa).
        tests:
          - not_null
      - name: sk_votacao
        description: Chave substituta da votação, compatível com int_votacoes_camara_deduplicadas.
        tests:
          - not_null
      - name: casa
        description: Casa legislativa (CAMARA).
      - name: id_deputado
        description: Identificador do deputado na API da Câmara.
      - name: id_votacao
        description: Identificador da votação.
      - name: voto
        description: "Voto registrado (SIM, NAO, ABSTENCAO, OBSTRUCAO). BRANCO e FAVORAVEL COM RESTRICOES normalizados."

  - name: int_votacoes_camara_deduplicadas
    description: "Sessões de votação da Câmara com chave substituta gerada. Alimenta dim_votacoes."
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (id + casa).
        tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: casa
        description: Casa legislativa (CAMARA).
      - name: id
        description: Identificador original da votação na API da Câmara.
      - name: data_votacao
        description: Data em que a votação ocorreu.
      - name: sigla_orgao
        description: Sigla do órgão que realizou a votação (ex. PLEN, CSPCCO).
      - name: proposicao_objeto
        description: Descrição da proposição objeto da votação.
      - name: aprovado
        description: Booleano indicando se a proposição foi aprovada.

  - name: int_orientacoes_camara_corrigidas
    description: "Orientações de voto por partido/liderança por sessão de votação da Câmara. Alimenta dim_orientacao_votacoes."
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (id_votacao + casa).
        tests:
          - not_null
      - name: id_votacao
        description: Identificador da votação à qual a orientação se refere.
      - name: casa
        description: Casa legislativa (CAMARA).
      - name: orientacao_voto
        description: Orientação de voto dada pelo líder (SIM, NÃO, OBSTRUÇÃO).
      - name: tipo_lideranca
        description: Tipo de liderança que deu a orientação (BANCADA ou PARTIDO).
      - name: sigla_partido_bloco
        description: Sigla do partido ou bloco que recebeu a orientação (normalizada).

  - name: int_votos_senado_filtrados
    description: "Votos individuais de senadores normalizados com chaves substitutas geradas. Alimenta fct_votos."
    columns:
      - name: sk_voto
        description: Chave substituta do voto (codigo_parlamentar + codigo_votacao + casa).
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: Chave substituta do parlamentar (codigo_parlamentar + casa).
        tests:
          - not_null
      - name: sk_votacao
        description: Chave substituta da votação, compatível com int_votacoes_senado_filtradas.
        tests:
          - not_null
      - name: casa
        description: Casa legislativa (SENADO).
      - name: id_senador
        description: Código do senador na API do Senado.
      - name: id_votacao
        description: Código da votação na API do Senado.
      - name: data_sessao
        description: Data da sessão de votação.
      - name: identificacao
        description: Descrição ou identificação da matéria votada.
      - name: voto
        description: "Voto registrado (SIM, NAO, ABSTENCAO, OBSTRUCAO)."

  - name: int_votacoes_senado_filtradas
    description: "Sessões de votação do Senado com chave substituta gerada. Alimenta dim_votacoes."
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (codigo_votacao + casa).
        tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: casa
        description: Casa legislativa (SENADO).
      - name: id
        description: Código original da votação na API do Senado.
      - name: data_sessao
        description: Data da sessão de votação.
      - name: identificacao
        description: Descrição da matéria votada.
      - name: aprovado
        description: 1 se aprovado, 0 caso contrário.

  - name: int_orientacoes_senado_filtradas
    description: "Orientações de voto por partido/bancada por sessão de votação do Senado. Alimenta dim_orientacao_votacoes."
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (codigo_votacao + casa).
        tests:
          - not_null
      - name: casa
        description: Casa legislativa (SENADO).
      - name: codigo_votacao
        description: Código da votação na API do Senado.
      - name: numero_materia
        description: Número da matéria votada.
      - name: sigla_tipo_materia
        description: Sigla do tipo de matéria (PL, PEC, etc.).
      - name: partido
        description: Sigla do partido que recebeu a orientação.
      - name: orientacao_voto
        description: Orientação de voto (SIM, NAO, OBSTRUCAO — LIBERADO já filtrado).
