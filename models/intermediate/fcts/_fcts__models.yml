version: 2

models:
  - name: int_fct_ranking_parlamentares_total
    description: "Fato de ranking dos políticos para todos os parlamentares (Câmara e Senado) com pontuações, posições e métricas financeiras. Grain: um registro por parlamentar."
    columns:
      - name: sk_parlamentar
        description: Chave substituta estável do parlamentar (derivada de id+natureza da casa).
        tests:
          - not_null
          - unique
      - name: casa
        description: Casa legislativa do parlamentar (camara/senado).
      - name: score_total
        description: Pontuação total atribuída pelo Ranking dos Políticos ao parlamentar.
      - name: score_antiprivilegio
        description: Subpontuação relacionada a postura antiprivilegios.
      - name: score_antidesperdicio
        description: Subpontuação relacionada a assiduidade e combate a desperdícios.
      - name: score_processos
        description: Subpontuação relacionada à existência/gravidade de processos.
      - name: score_outros
        description: Subpontuação residual (outros critérios) do Ranking.
      - name: ranking_por_cargo
        description: Posição do parlamentar no ranking dentro do seu cargo.
      - name: ranking_por_estado
        description: Posição do parlamentar no ranking dentro do seu estado.
      - name: cnt_parlamentares_estado
        description: Quantidade total de parlamentares do estado, conforme definição da fonte.
      - name: cnt_cargo_por_estado
        description: Quantidade total de parlamentares do mesmo cargo no estado.
      - name: total_parlamentares
        description: Quantidade total de parlamentares na base do Ranking (todas as casas), quando informado.
      - name: total_parlamentar_por_casa
        description: Quantidade total de parlamentares no mesmo cargo/casa, quando informado.
      - name: perc_economia
        description: Percentual de economia de verbas ao longo do mandato/corte considerado. Confirmar escala (0–1 ou 0–100).
      - name: vlr_mandato_disponivel_total
        description: Valor total disponível no mandato (soma de cotas/verbas) segundo a fonte.
      - name: vlr_mandato_gasto_total
        description: Valor total gasto no mandato.
      - name: vlr_mandato_economizado_total
        description: Valor total economizado no mandato.
      - name: vlr_cota_parlamentar_disponivel_subtotal
        description: Valor disponível referente à cota parlamentar.
      - name: vlr_cota_parlamentar_gasto_subtotal
        description: Valor gasto referente à cota parlamentar.
      - name: vlr_cota_parlamentar_economizado_subtotal
        description: Valor economizado referente à cota parlamentar.
      - name: vlr_verba_gabinete_disponivel_subtotal
        description: Valor disponível referente à verba de gabinete.
      - name: vlr_verba_gabinete_gasto_subtotal
        description: Valor gasto referente à verba de gabinete.
      - name: vlr_verba_gabinete_economizado_subtotal
        description: Valor economizado referente à verba de gabinete.
  - name: int_fct_governismo_parlamentares_total
    description: "Fato consolidado de governismo para todos os parlamentares (Câmara e Senado). Grain: um registro por parlamentar. Desabilitado enquanto radar_congresso estiver inativo (enabled=false)."
    columns:
      - name: sk_parlamentar
        description: Chave substituta estável do parlamentar (derivada de id+natureza da casa).
        tests:
          - not_null
          - unique
      - name: casa
        description: Casa legislativa do parlamentar (camara/senado).
      - name: total_votos_favor_governo
        description: Quantidade total de votos do parlamentar alinhados ao governo.
      - name: total_votos_contra_governo
        description: Quantidade total de votos do parlamentar contrários ao governo.
      - name: perc_governismo
        description: Percentual de alinhamento ao governo. Confirmar escala (0–1 ou 0–100) e padronizar na camada de apresentação.
      - name: data_carga
        description: Data/hora de carga da fonte do Radar Congresso utilizada no cálculo.
  - name: int_fct_governismo_parlamentares_trimestre
    description: "Fato de governismo trimestral para todos os parlamentares (Câmara e Senado). Grain: um registro por parlamentar por trimestre. Desabilitado enquanto radar_congresso estiver inativo (enabled=false)."
    columns:
      - name: sk_parlamentar
        description: Chave substituta estável do parlamentar.
        tests:
          - not_null
      - name: casa
        description: Casa legislativa do parlamentar no período (camara/senado).
      - name: data_trimestre
        description: Data representativa do trimestre de referência (normalizada para início do trimestre em casos específicos).
      - name: perc_governismo_trimestre
        description: Percentual de alinhamento ao governo no trimestre. Confirmar escala (0–1 ou 0–100).
      - name: data_carga
        description: Data/hora de carga da fonte do Radar Congresso utilizada no cálculo.
  - name: int_fct_ecidadania_bignumbers
    description: Fato com os totais agregados de votações e votantes na plataforma e-Cidadania.
    columns:
      - name: data_extracao
        description: Data de extração dos dados da fonte.
      - name: total_proposicoes_votadas
        description: Quantidade total de proposições que receberam votos.
      - name: total_pessoas_votaram
        description: Quantidade total de pessoas distintas que votaram.
      - name: total_votos_registrados
        description: Quantidade total de votos registrados na plataforma.
      - name: votos_por_pessoa
        description: Média de votos por pessoa (total_votos / total_pessoas).
  - name: int_fct_ecidadania_proposicoes
    description: Fato com métricas de votação por proposição na plataforma e-Cidadania, com flag indicando se foi a mais votada no dia da extração.
    columns:
      - name: data_extracao
        description: Data de extração dos dados da fonte.
      - name: ano_proposicao
        description: Ano de apresentação da proposição.
      - name: sigla_proposicao
        description: Sigla do tipo de proposição (ex PL, PEC).
      - name: sk_proposicao
        description: Chave substituta da proposição.
        tests:
          - not_null
      - name: id_proposicao
        description: Identificador da proposição na fonte.
      - name: ementa
        description: Ementa descritiva da proposição.
      - name: votos_sim
        description: Quantidade de votos favoráveis à proposição.
      - name: votos_nao
        description: Quantidade de votos contrários à proposição.
      - name: total_votos
        description: Total de votos registrados para a proposição.
      - name: vontade_popular
        description: Indicador da vontade popular (SIM/NÃO) com base na maioria dos votos.
      - name: link
        description: URL da proposição na plataforma e-Cidadania.
      - name: flag_mais_votado_no_dia
        description: Booleano indicando se a proposição estava entre as mais votadas na data de extração.
  - name: int_fct_votacoes
    description: "Fato de sessões de votação da Câmara dos Deputados. Grain: uma votação por sessão."
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (id + casa).
        tests:
          - not_null
          - unique
      - name: casa
        description: Casa legislativa (camara).
      - name: id
        description: Identificador original da votação na API da Câmara.
      - name: data_votacao
        description: Data em que a votação ocorreu.
      - name: sigla_orgao
        description: Sigla do órgão que realizou a votação (ex. PLEN, CSPCCO).
      - name: proposicao_objeto
        description: Descrição da proposição objeto da votação.
      - name: aprovado
        description: Booleano indicando se a proposição foi aprovada.
  - name: int_fct_votacoes_orientacao
    description: "Fato de orientações de voto por partido/liderança por votação da Câmara. Grain: uma orientação por partido/bloco por votação."
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (id_votacao + casa).
        tests:
          - not_null
      - name: id_votacao
        description: Identificador da votação à qual a orientação se refere.
      - name: casa
        description: Casa legislativa (camara).
      - name: sigla_partido_bloco
        description: Sigla do partido ou bloco que recebeu a orientação.
      - name: orientacao_voto
        description: Orientação de voto dada pelo líder (SIM, NÃO, LIBERADO, OBSTRUÇÃO).
      - name: codigo_tipo_liderancao
        description: Código do tipo de liderança que deu a orientação.
      - name: codigo_partido_bloco
        description: Código do partido ou bloco que recebeu a orientação.
  - name: int_fct_votos
    description: "Fato de votos individuais por deputado por votação da Câmara. Grain: um voto por deputado por votação."
    columns:
      - name: sk_voto
        description: Chave substituta do voto (id_deputado + id_votacao + casa).
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: Chave substituta do parlamentar (id_deputado + casa), compatível com int_map_parlamentares.
        tests:
          - not_null
      - name: sk_votacao
        description: Chave substituta da votação, compatível com int_fct_votacoes.
        tests:
          - not_null
      - name: casa
        description: Casa legislativa (camara).
      - name: id_deputado
        description: Identificador do deputado na API da Câmara.
      - name: id_votacao
        description: Identificador da votação.
      - name: id_legislatura
        description: Identificador da legislatura na qual o voto foi registrado.
      - name: voto
        description: "Voto registrado (SIM, NAO, ABSTENCAO, OBSTRUCAO). BRANCO e FAVORAVEL COM RESTRICOES normalizados."